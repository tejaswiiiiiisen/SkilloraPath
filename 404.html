<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>SkilloraPath | Loading...</title>
    <script>
      // Single Page Apps for GitHub Pages
      // https://github.com/rafgraph/spa-github-pages
      var pathSegmentsToKeep = 1;
      var l = window.location;
      var base = l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/');
      if (!base.endsWith('/')) base += '/';
      var route = l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~');
      if (route && !route.startsWith('/')) route = '/' + route;
      var query = l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '';
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        base + '?' + route + query + l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
