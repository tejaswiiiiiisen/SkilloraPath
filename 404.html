<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>SkilloraPath | Loading...</title>
    <script>
      (function() {
        var l = window.location;
        var host = l.hostname;
        var repo = 'SkilloraPath';
        var repoBase = '/' + repo;

        var path = l.pathname;
        var route = '';

        if (path.toLowerCase().startsWith(repoBase.toLowerCase())) {
          route = path.slice(repoBase.length);
        } else {
          route = path;
        }

        if (route.startsWith('/')) {
          route = route.slice(1);
        }

        var query = l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '';
        var redirectUrl = l.protocol + '//' + l.host + repoBase + '/?' + (route ? '/' + route.replace(/&/g, '~and~') : '') + query + l.hash;

        l.replace(redirectUrl);
      })();
    </script>
  </head>
  <body style="background:#070F26; color:#94A3B8; font-family:sans-serif; text-align:center; padding-top:20vh;">
    <div style="font-size:20px; font-weight:bold; color:#ffffff; margin-bottom:10px;">SkilloraPath</div>
    <p>Navigating to requested page...</p>
  </body>
</html>
